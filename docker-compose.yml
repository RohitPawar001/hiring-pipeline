services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: hiring
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d hiring"]
      interval: 3s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/hiring
      APP_TZ: Asia/Kolkata
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
